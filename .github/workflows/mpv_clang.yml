name: mpv clang
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:

jobs:
  build_mpv:
    name: Building mpv (64-bit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bit: [x86_64]
    env:
      BIT: ${{ matrix.bit }}
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest

    steps:
      - name: Init variable
        run: |
          echo "arch=x86_64" >> $GITHUB_ENV

      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config --global fetch.prune true
          git config --global --add safe.directory "*"

      - uses: actions/checkout@main
        with:
          ref: master

      - name: Download toolchain artifact from llvm_clang
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: llvm_clang.yml
          name: toolchain
          path: clang_root
        continue-on-error: true

      - name: Loading clang sysroot cache
        uses: actions/cache/restore@main
        with:
          path: clang_root
          key: clang_root-${{ github.run_id }}
          restore-keys: |
            clang_root
            ${{ secrets.CACHE_VERSION }}-clang_root

      - name: Loading repository cache
        uses: actions/cache/restore@main
        with:
          path: src_packages
          key: repository-${{ github.run_id }}
          restore-keys: |
            repository
            ${{ secrets.CACHE_VERSION }}-repository

      - name: Loading toolchain cache
        uses: actions/cache/restore@main
        with:
          path: build_${{ matrix.bit }}
          key: clang-${{ matrix.bit }}_toolchain-${{ github.run_id }}
          restore-keys: |
            clang-${{ matrix.bit }}_toolchain
            ${{ secrets.CACHE_VERSION }}-clang-${{ matrix.bit }}_toolchain

      - name: Configuring CMake & Downloading source
        run: |
          cmake -DTARGET_ARCH=${{ env.arch }}-w64-mingw32 -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_$BIT/$BIT-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -DENABLE_CCACHE=ON -DCLANG_PACKAGES_LTO=ON -G Ninja --fresh -B build_$BIT -S $PWD
          ninja -C build_$BIT download || true

      - name: Apply Yaozhi Enhanced Patches (Robust Multi-Branch)
        run: |
          set +e
          echo "==============================="
          echo "==> Yaozhi 补丁注入开始 (全分支扫描模式)"
          echo "==============================="
          YAOZHI_REPO="https://github.com/Yaozhil/mpv-Yaozhi.git"
          YAOZHI_DIR="yaozhi_src"
          BUILD_DIR_FOUND=""
          for br in master main build patches custom dev; do
            echo "--> 尝试分支: [$br]"
            rm -rf "$YAOZHI_DIR"
            git clone --depth 1 -b "$br" "$YAOZHI_REPO" "$YAOZHI_DIR" 2>/dev/null
            if [ -d "$YAOZHI_DIR/build" ]; then
              echo "==> 在分支 [$br] 找到 build/ 目录！"
              BUILD_DIR_FOUND="$YAOZHI_DIR/build"
              break
            fi
          done
          if [ -z "$BUILD_DIR_FOUND" ]; then
            echo "==> 分支扫描失败，执行深克隆全仓库递归查找 .patch 集合..."
            rm -rf "$YAOZHI_DIR"
            git clone --depth 50 "$YAOZHI_REPO" "$YAOZHI_DIR" 2>/dev/null
            BUILD_DIR_FOUND="$(find "$YAOZHI_DIR" -type d -name build 2>/dev/null | head -n1)"
            [ -n "$BUILD_DIR_FOUND" ] && echo "==> 递归发现 build 目录: $BUILD_DIR_FOUND"
          fi
          if [ -z "$BUILD_DIR_FOUND" ]; then
            BUILD_DIR_FOUND="$(find "$YAOZHI_DIR" -maxdepth 3 -type d $ -name "patches" -o -name "patch" $ 2>/dev/null | head -n1)"
            [ -n "$BUILD_DIR_FOUND" ] && echo "==> 找到 patches 目录: $BUILD_DIR_FOUND"
          fi
          if [ -n "$BUILD_DIR_FOUND" ] && [ -d "$BUILD_DIR_FOUND" ]; then
            echo "==> 开始注入 Yaozhi 补丁到 mpv / ffmpeg / libplacebo..."
            for patch_dir in "$BUILD_DIR_FOUND"/*/; do
              dir_name="$(basename "$patch_dir")"
              [ ! -d "$patch_dir" ] && continue
              patch_list="$(find "$patch_dir" -maxdepth 3 -name "*.patch" 2>/dev/null)"
              patch_count="$(echo "$patch_list" | grep -cv '^$' || true)"
              [ "$patch_count" -eq 0 ] && continue
              echo "----> 补丁集 [$dir_name] 共 $patch_count 个"
              echo "$patch_list" | while IFS= read -r p; do
                [ -z "$p" ] && continue
                pf="$(basename "$p")"
                applied=0
                if git -C src_packages/mpv apply --check "$p" 2>/dev/null; then
                  echo "      [mpv   ] + $pf"
                  git -C src_packages/mpv apply -v "$p" 2>/dev/null && applied=1
                fi
                if git -C src_packages/ffmpeg apply --check "$p" 2>/dev/null; then
                  echo "      [ffmpeg] + $pf"
                  git -C src_packages/ffmpeg apply -v "$p" 2>/dev/null && applied=1
                fi
                if [ -d "src_packages/libplacebo/.git" ] && git -C src_packages/libplacebo apply --check "$p" 2>/dev/null; then
                  echo "      [libplc] + $pf"
                  git -C src_packages/libplacebo apply -v "$p" 2>/dev/null && applied=1
                fi
                [ $applied -eq 0 ] && echo "      [skip  ] - $pf"
              done
            done
            echo "==> 补丁注入完毕"
          else
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "!!! 严重警告：找不到 Yaozhi 补丁目录，所有高级特性将缺失！"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            ls -la "$YAOZHI_DIR" 2>/dev/null
          fi

      - name: Upgrade core packages to latest master HEAD
        run: |
          set +e
          echo "==> 升级核心包源码到最新版本"
          for pkg in ffmpeg mpv libplacebo libbluray; do
            dir="src_packages/$pkg"
            [ ! -d "$dir/.git" ] && echo "--> [$pkg] skip (no git)" && continue
            echo "--> [$pkg] fetch latest master/main ..."
            git -C "$dir" fetch --depth 1 origin master 2>/dev/null
            if git -C "$dir" rev-parse FETCH_HEAD >/dev/null 2>&1; then
              git -C "$dir" reset --hard FETCH_HEAD 2>/dev/null
            else
              git -C "$dir" fetch --depth 1 origin main 2>/dev/null
              git -C "$dir" reset --hard FETCH_HEAD 2>/dev/null || true
            fi
            sha="$(git -C "$dir" rev-parse --short HEAD 2>/dev/null)"
            echo "    ==> [$pkg] HEAD: $sha"
          done
          echo "==> 源码升级完毕"

      - name: Building mpv
        run: |
          find . -name "index.lock" -delete 2>/dev/null || true
          ninja -C build_$BIT -j 1 update || true
          find . -name "index.lock" -delete 2>/dev/null || true
          ninja -C build_$BIT mpv

      - name: Packaging mpv
        run: |
          mkdir -p release_$BIT
          ninja -C build_$BIT mpv-packaging
          mv build_$BIT/mpv*.7z release_$BIT/

      - name: Uploading mpv build artifact
        uses: actions/upload-artifact@main
        with:
          name: mpv-custom-x86_64
          path: release_${{ matrix.bit }}/mpv*.7z
          retention-days: 7
